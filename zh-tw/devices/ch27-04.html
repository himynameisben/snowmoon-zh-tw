<div class="device-view wide-device-view device-view-left"><p>重點摘要：</p>
<ul><li>在任何「一般」情境下——也就是維瑞迪亞軍方維持現狀，或是在沒有強大外部壓力的情況下由維瑞迪亞議會主導改組——維瑞迪亞一年後控制自身領土的比例維持不變或更高的機率為 20%。</li><li>假設改由昆高派掌控，機率升至 26%。</li><li>主要的下行風險在於一般的組織轉換成本，這在領導層混亂更迭、以外人取代經驗豐富的人員時很典型。</li><li>在昆高派參與、但盡量降低轉換衝擊的情況下，成功的機率最高（可達 50%）。</li><li>請注意，以上機率是指一年後控制範圍<em>維持不變或更大</em>。控制範圍嚴格大於現在的機率，一律低得多。</li></ul></div>
